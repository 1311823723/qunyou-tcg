name: Deploy Battle Worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-battle-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BATTLE_WORKER_URL: ${{ vars.BATTLE_WORKER_URL }}
      WRANGLER_LOG_PATH: /tmp/wrangler-deploy.log
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$BATTLE_WORKER_URL" || { echo "::error::Missing BATTLE_WORKER_URL repository variable"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        run: npm run deploy:battle

      - name: Verify lobby endpoint
        run: |
          endpoint="${BATTLE_WORKER_URL%/}/lobby"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$endpoint" > lobby-health.json
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("lobby-health.json", "utf8")); if (!Array.isArray(data.rooms) || typeof data.generatedAt !== "number") process.exit(1); console.log(`Lobby healthy: ${data.rooms.length} rooms`);'
