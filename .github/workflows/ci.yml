name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-ci.log
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate card data
        run: npm run validate

      - name: Audit card art
        run: npm run art:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Run battle tests
        run: npm run test:battle

      - name: Validate playtest records
        run: npm run test:playtest && npm run playtest:report

      - name: Check Worker build
        run: npm run build:battle

      - name: Build website
        run: npm run build:web

  e2e:
    name: Browser battle E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-e2e.log
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser battle tests
        run: npm run test:battle:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/wrangler-e2e.log
          if-no-files-found: ignore
          retention-days: 7
